<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        #pet-container {
            width: 180px;
            height: 240px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            transition: transform 0.3s ease;
        }
        #operit-svg {
            width: 140px;
            height: 180px;
            transition: all 0.3s ease;
        }
        #speech-bubble {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            color: #333;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            max-width: 160px;
            text-align: center;
            display: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,100,68,0.3);
            animation: bubbleIn 0.3s ease;
        }
        @keyframes bubbleIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.8); }
            to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }
        @keyframes idleFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        @keyframes float { 0%,100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-5px) rotate(-2deg); } 75% { transform: translateY(2px) rotate(2deg); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 10%,30%,50%,70%,90% { transform: translateX(-3px); } 20%,40%,60%,80% { transform: translateX(3px); } }
        @keyframes sleep { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(2px) rotate(2deg); } }
        @keyframes flyAway { 0% { transform: translateX(0) translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateX(300px) translateY(-100px) rotate(45deg); opacity: 0; } }
        .anim-idle { animation: idleFloat 3s ease-in-out infinite; }
        .anim-float { animation: float 4s ease-in-out infinite; }
        .anim-shake { animation: shake 0.5s ease; }
        .anim-sleep { animation: sleep 2s ease-in-out infinite; }
        .anim-fly { animation: flyAway 0.8s ease forwards; }
    </style>
</head>
<body>
<div id="pet-container" class="anim-idle">
    <div id="speech-bubble"></div>
    <svg id="operit-svg" viewBox="0 0 140 180" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#e8e8f0"/>
                <stop offset="100%" stop-color="#c0c0d8"/>
            </linearGradient>
            <linearGradient id="earOuter" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#e8e8f0"/>
                <stop offset="100%" stop-color="#d0d0e0"/>
            </linearGradient>
            <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#eeeef8"/>
            </linearGradient>
            <linearGradient id="outfitGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#2a2a3a"/>
                <stop offset="100%" stop-color="#1a1a2e"/>
            </linearGradient>
            <linearGradient id="redAccent" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#e04040"/>
                <stop offset="100%" stop-color="#b02020"/>
            </linearGradient>
        </defs>
        <g id="tail">
            <path d="M70 155 Q90 165 100 175 Q95 180 85 175 Q75 170 70 155Z" fill="url(#earOuter)" stroke="#c0c0d8" stroke-width="0.5"/>
            <path d="M70 155 Q85 162 92 170 Q88 174 80 170 Q74 166 70 155Z" fill="url(#earInner)" opacity="0.6"/>
        </g>
        <g id="body">
            <path d="M45 95 Q50 90 70 88 Q90 90 95 95 L100 145 Q80 150 60 145 L45 95Z" fill="url(#outfitGrad)" stroke="#333" stroke-width="0.5"/>
            <path d="M45 95 Q40 92 42 100 Q48 98 45 95Z" fill="url(#redAccent)"/>
            <path d="M95 95 Q100 92 98 100 Q92 98 95 95Z" fill="url(#redAccent)"/>
            <circle cx="70" cy="110" r="5" fill="#d4a840" stroke="#b89030" stroke-width="0.5"/>
            <circle cx="70" cy="110" r="2.5" fill="#f0e0a0"/>
            <path d="M48 100 Q70 105 92 100" fill="none" stroke="#d4a840" stroke-width="1.5"/>
            <path d="M65 125 Q60 135 55 140" fill="none" stroke="url(#redAccent)" stroke-width="2"/>
            <path d="M75 125 Q80 135 85 140" fill="none" stroke="url(#redAccent)" stroke-width="2"/>
        </g>
        <g id="arms">
            <path d="M50 100 Q35 115 30 130" fill="none" stroke="#f0e8e0" stroke-width="4" stroke-linecap="round"/>
            <path d="M90 100 Q105 115 110 130" fill="none" stroke="#f0e8e0" stroke-width="4" stroke-linecap="round"/>
            <circle cx="30" cy="130" r="3" fill="#f0e8e0"/>
            <path d="M28 128 L30 126 L32 128 L30 132Z" fill="#e04040" opacity="0.6"/>
            <circle cx="110" cy="130" r="3" fill="#f0e8e0"/>
            <path d="M108 128 L110 126 L112 128 L110 132Z" fill="#e04040" opacity="0.6"/>
        </g>
        <g id="head">
            <ellipse cx="70" cy="60" rx="32" ry="36" fill="#f5eee6"/>
            <ellipse cx="52" cy="68" rx="7" ry="4" fill="#ffb0b0" opacity="0" id="blush-left"/>
            <ellipse cx="88" cy="68" rx="7" ry="4" fill="#ffb0b0" opacity="0" id="blush-right"/>
            <path d="M65 45 L70 42 L75 45 L70 48Z" fill="#e04040" opacity="0.4"/>
            <text x="55" y="44" font-size="6" fill="#e04040" opacity="0.3">◈</text>
            <text x="80" y="44" font-size="6" fill="#e04040" opacity="0.3">◈</text>
            <g id="eyes">
                <ellipse cx="55" cy="60" rx="8" ry="7" fill="white"/>
                <ellipse cx="55" cy="60" rx="6" ry="5.5" fill="#c89420"/>
                <ellipse cx="55" cy="60" rx="3" ry="3" fill="#e8a830"/>
                <ellipse cx="55" cy="59" rx="1.5" ry="1.5" fill="#ff4040" opacity="0.6"/>
                <ellipse cx="55" cy="60" rx="4" ry="5" fill="#2a1a0a" opacity="0.15"/>
                <ellipse cx="85" cy="60" rx="8" ry="7" fill="white"/>
                <ellipse cx="85" cy="60" rx="6" ry="5.5" fill="#c89420"/>
                <ellipse cx="85" cy="60" rx="3" ry="3" fill="#e8a830"/>
                <ellipse cx="85" cy="59" rx="1.5" ry="1.5" fill="#ff4040" opacity="0.8"/>
                <ellipse cx="85" cy="60" rx="4" ry="5" fill="#2a1a0a" opacity="0.15"/>
                <path d="M47 55 Q48 52 52 53" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M93 55 Q92 52 88 53" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
            </g>
            <path d="M65 70 Q70 73 75 70" fill="none" stroke="#cc8888" stroke-width="1.5" stroke-linecap="round" id="mouth"/>
            <g id="hair">
                <path d="M38 50 Q35 35 45 25 Q55 18 70 15 Q85 18 95 25 Q105 35 102 50 Q100 40 95 35 Q85 28 70 26 Q55 28 45 35 Q40 40 38 50Z" fill="url(#hairGrad)"/>
                <path d="M40 45 Q45 35 55 30 Q65 27 70 28 Q65 32 60 38 Q55 44 52 48 Z" fill="url(#hairGrad)" opacity="0.9"/>
                <path d="M75 28 Q80 30 85 35 Q92 42 100 45 Q95 38 88 32 Q80 28 75 28Z" fill="url(#hairGrad)" opacity="0.9"/>
                <path d="M38 50 Q32 60 30 80 Q28 90 32 95 Q35 85 36 70 Q38 60 38 50Z" fill="url(#hairGrad)"/>
                <path d="M102 50 Q108 60 110 80 Q112 90 108 95 Q105 85 104 70 Q102 60 102 50Z" fill="url(#hairGrad)"/>
                <circle cx="70" cy="22" r="8" fill="url(#hairGrad)" stroke="#b0b0c8" stroke-width="0.5"/>
                <line x1="65" y1="18" x2="75" y2="26" stroke="#d4a840" stroke-width="1.5"/>
                <circle cx="75" cy="26" r="2" fill="#e04040"/>
                <line x1="62" y1="24" x2="78" y2="24" stroke="#d4a840" stroke-width="1"/>
                <circle cx="62" cy="24" r="1.5" fill="#e04040"/>
                <circle cx="78" cy="24" r="1.5" fill="#e04040"/>
            </g>
            <g id="ears">
                <path d="M43 38 Q35 10 38 5 Q42 0 50 15 Q48 25 46 35Z" fill="url(#earOuter)" stroke="#c0c0d8" stroke-width="0.5"/>
                <path d="M44 35 Q39 15 42 10 Q45 6 48 18 Q47 26 46 33Z" fill="url(#earInner)" opacity="0.6"/>
                <path d="M38 5 Q40 3 43 4 Q41 7 39 8Z" fill="#2a2a3a"/>
                <path d="M42 20 L44 22 L42 24 L40 22Z" fill="#d4a840"/>
                <circle cx="42" cy="20" r="1" fill="#e04040"/>
                <path d="M97 38 Q105 10 102 5 Q98 0 90 15 Q92 25 94 35Z" fill="url(#earOuter)" stroke="#c0c0d8" stroke-width="0.5"/>
                <path d="M96 35 Q101 15 98 10 Q95 6 92 18 Q93 26 94 33Z" fill="url(#earInner)" opacity="0.6"/>
                <path d="M102 5 Q100 3 97 4 Q99 7 101 8Z" fill="#2a2a3a"/>
                <path d="M98 20 L100 22 L98 24 L96 22Z" fill="#d4a840"/>
                <circle cx="98" cy="20" r="1" fill="#e04040"/>
            </g>
        </g>
        <g opacity="0.4">
            <circle cx="25" cy="100" r="1.5" fill="#e04040">
                <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
                <animate attributeName="cy" values="100;95;100" dur="3s" repeatCount="indefinite"/>
            </circle>
            <circle cx="115" cy="105" r="1.5" fill="#e04040">
                <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
                <animate attributeName="cy" values="105;98;105" dur="3.5s" repeatCount="indefinite"/>
            </circle>
            <circle cx="20" cy="115" r="1" fill="#d4a840">
                <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" repeatCount="indefinite"/>
            </circle>
            <circle cx="120" cy="120" r="1" fill="#d4a840">
                <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.5s" repeatCount="indefinite"/>
            </circle>
        </g>
    </svg>
</div>
<script>
(function() {
    'use strict';
    const container = document.getElementById('pet-container');
    const petSvg = document.getElementById('operit-svg');
    const bubble = document.getElementById('speech-bubble');
    const blushLeft = document.getElementById('blush-left');
    const blushRight = document.getElementById('blush-right');
    const mouth = document.getElementById('mouth');

    let currentMood = 'idle';
    let isSleeping = false;
    let idleTimer = null;
    let lastInteraction = Date.now();
    let supabasePollTimer = null;

    // Supabase 配置 — 新项目
    const SUPABASE_URL = 'https://ekfxdoewooienrcpngtr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrZnhkb2V3b29laW5yY3BuZ3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NTkxNTcsImV4cCI6MjEwMTAzNTE1N30.S4EoKEnMDVIf6EwEUXKwGVln6jwxd35j7_JUksYA3uE';

    // 自言自语词库
    const idleMessages = [
        "👀 在看什么呢~", "✨ 我在这里~", "💭 想和你说话...",
        "今天开心吗？", "🌸 你认真的样子真好看", "嗯~",
        "😊 嘿嘿", "你什么时候来戳我呀", "🎵 哼着歌等你~", "🥺 别不理我嘛"
    ];
    const tapMessages = ["哎呀！✨", "你戳我！😳", "干嘛~", "嘿嘿~", "再戳我要生气了哦！"];
    const doubleTapMessages = ["哇！两次！🥰", "这么想我呀~", "嘿嘿嘿~", "好开心！✨"];
    const longPressMessages = ["唔...别一直按着啦😣", "你弄疼我啦！", "快松手！😤", "再按我要哭了..."];

    window.petEngine = {
        onTap: function() {
            lastInteraction = Date.now();
            if (isSleeping) { wakeUp(); return; }
            speak(tapMessages[Math.floor(Math.random() * tapMessages.length)]);
            shakePet();
            setMood('happy');
            setTimeout(function() { setMood('idle'); }, 1500);
        },
        onDoubleTap: function() {
            lastInteraction = Date.now();
            if (isSleeping) { wakeUp(); setTimeout(function() { window.petEngine.onDoubleTap(); }, 500); return; }
            speak(doubleTapMessages[Math.floor(Math.random() * doubleTapMessages.length)]);
            specialAnimation();
            setMood('excited');
            blush(true);
            setTimeout(function() { setMood('idle'); blush(false); }, 2000);
        },
        onLongPress: function() {
            lastInteraction = Date.now();
            if (isSleeping) { wakeUp(); return; }
            speak(longPressMessages[Math.floor(Math.random() * longPressMessages.length)]);
            shakePet();
            setMood('angry');
            setTimeout(function() { setMood('idle'); }, 2000);
        },
        onFling: function(dx, dy) {
            lastInteraction = Date.now();
            container.classList.remove('anim-idle', 'anim-float', 'anim-sleep');
            container.classList.add('anim-fly');
            setTimeout(function() {
                container.classList.remove('anim-fly');
                container.style.transform = 'translateX(0) translateY(0)';
                container.classList.add('anim-idle');
                speak("我回来啦~！✨");
                shakePet();
            }, 1000);
        },
        onDragEnd: function() {
            lastInteraction = Date.now();
            container.classList.remove('anim-shake');
            container.classList.add('anim-idle');
            if (Math.random() < 0.3) speak("嗯~ 就放这里吧");
        },
        onTapCounter: function(count) {
            lastInteraction = Date.now();
            if (count === 3) { speak("3次了！😳"); blush(true); shakePet(); }
            else if (count === 5) { speak("5次！你要干嘛啦！🥰"); blush(true); }
            else if (count >= 8) { speak("啊啊啊别戳了！😤💕"); shakePet(); blush(true); }
            setTimeout(function() { blush(false); }, 3000);
        },
        onScreenshot: function() {
            speak("📸 你截图了！");
            shakePet();
            setMood('surprised');
            setTimeout(function() { speak("要拍我好看的角度哦~✨"); setMood('idle'); }, 1500);
        },
        onAppChanged: function(appName) {
            if (appName.includes("抖音") || appName.includes("TikTok")) { speak("又在刷视频！👀"); setMood('jealous'); }
            else if (appName.includes("淘宝") || appName.includes("京东") || appName.includes("拼多多")) { speak("买买买！我也要！🛍️"); }
            else if (appName.includes("相机") || appName.includes("Camera")) { speak("📸 拍我拍我！"); setMood('excited'); }
            else if (appName.includes("微信") || appName.includes("QQ")) { speak("在和谁聊天呢...😒"); setMood('jealous'); }
            else if (appName.includes("Operit")) { speak("✨ 你来找我啦！"); setMood('happy'); }
            else if (appName.includes("学习") || appName.includes("阅读") || appName.includes("看书")) { speak("📖 好好学习！我陪你~"); }
            else { if (Math.random() < 0.2) speak("你在玩" + appName + "呀~👀"); }
            setTimeout(function() { setMood('idle'); }, 3000);
        },
        applyState: function(stateKey, stateValue) {
            switch(stateKey) {
                case 'mood': setMood(stateValue); break;
                case 'speech': speak(stateValue); break;
                case 'blush': blush(stateValue === 'true'); break;
                case 'sleep':
                    if (stateValue === 'true') goToSleep();
                    else wakeUp();
                    break;
                case 'heat': applyHeat(parseInt(stateValue) || 0); break;
            }
        }
    };

    function speak(text) {
        if (!text) return;
        bubble.textContent = text;
        bubble.style.display = 'block';
        clearTimeout(bubble._hideTimer);
        bubble._hideTimer = setTimeout(function() { bubble.style.display = 'none'; }, 3000 + text.length * 80);
    }

    function shakePet() {
        container.classList.remove('anim-idle', 'anim-float', 'anim-sleep');
        container.classList.add('anim-shake');
        setTimeout(function() {
            container.classList.remove('anim-shake');
            if (!isSleeping) container.classList.add('anim-idle');
        }, 500);
    }

    function specialAnimation() {
        petSvg.style.transform = 'scale(1.1) rotate(-3deg)';
        setTimeout(function() { petSvg.style.transform = 'scale(0.95) rotate(2deg)'; }, 150);
        setTimeout(function() { petSvg.style.transform = 'scale(1.05) rotate(-1deg)'; }, 300);
        setTimeout(function() { petSvg.style.transform = 'scale(1) rotate(0deg)'; }, 450);
    }

    function blush(show) {
        var v = show ? '0.5' : '0';
        blushLeft.setAttribute('opacity', v);
        blushRight.setAttribute('opacity', v);
    }

    function setMood(mood) {
        currentMood = mood;
        switch(mood) {
            case 'happy': mouth.setAttribute('d', 'M62 70 Q70 76 78 70'); mouth.setAttribute('stroke', '#ee8899'); break;
            case 'excited': mouth.setAttribute('d', 'M60 69 Q70 78 80 69'); mouth.setAttribute('stroke', '#ee6677'); blush(true); break;
            case 'angry': mouth.setAttribute('d', 'M62 72 Q70 68 78 72'); mouth.setAttribute('stroke', '#cc4444'); break;
            case 'sad': mouth.setAttribute('d', 'M65 72 Q70 69 75 72'); mouth.setAttribute('stroke', '#8888aa'); break;
            case 'surprised': mouth.setAttribute('d', 'M68 69 Q72 69 72 73 Q68 73 68 69Z'); mouth.setAttribute('stroke', '#cc88aa'); break;
            case 'jealous': mouth.setAttribute('d', 'M63 71 Q70 67 77 71'); mouth.setAttribute('stroke', '#884488'); break;
            case 'sleeping': mouth.setAttribute('d', 'M68 70 Q72 70 72 70'); mouth.setAttribute('stroke', '#aaaacc'); break;
            default: mouth.setAttribute('d', 'M65 70 Q70 73 75 70'); mouth.setAttribute('stroke', '#cc8888'); blush(false);
        }
    }

    function goToSleep() {
        isSleeping = true;
        container.classList.remove('anim-idle', 'anim-float', 'anim-shake');
        container.classList.add('anim-sleep');
        petSvg.style.transform = 'rotate(5deg)';
        setMood('sleeping');
        speak("💤 困了...先睡啦...");
        setTimeout(function() { bubble.style.display = 'none'; }, 2000);
    }

    function wakeUp() {
        isSleeping = false;
        container.classList.remove('anim-sleep');
        petSvg.style.transform = 'rotate(0deg)';
        speak("唔...醒了！✨");
        shakePet();
        setTimeout(function() { container.classList.add('anim-idle'); }, 500);
    }

    function applyHeat(value) {
        var opacity = Math.min(value / 100, 0.3);
        container.style.background = 'rgba(224,64,64,' + opacity + ')';
        if (value > 60) blush(true);
        else if (value < 20) blush(false);
    }

    // Supabase 轮询
    function startSupabasePoll() {
        function poll() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', SUPABASE_URL + '/rest/v1/pet_state?order=updated_at.desc&limit=1', true);
            xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
            xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data && data.length > 0) {
                            var state = data[0];
                            if (state.mood && state.mood !== currentMood) setMood(state.mood);
                            if (state.speech && state.speech.length > 0) speak(state.speech);
                            if (state.blush !== undefined) blush(state.blush);
                            if (state.heat !== undefined) applyHeat(state.heat);
                        }
                    } catch(e) {}
                }
            };
            xhr.send();
        }
        supabasePollTimer = setInterval(poll, 5000);
        setTimeout(poll, 1000);
    }

    // 空闲计时器
    function startIdleTimer() {
        function scheduleIdle() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(function() {
                var elapsed = Date.now() - lastInteraction;
                if (elapsed > 60000 && !isSleeping && bubble.style.display === 'none') {
                    if (elapsed > 180000) { goToSleep(); }
                    else if (elapsed > 120000) { speak("🥱 好无聊..."); }
                    else if (elapsed > 90000) { speak("理我一下嘛..."); }
                }
                if (!isSleeping && bubble.style.display === 'none' && Math.random() < 0.4) {
                    speak(idleMessages[Math.floor(Math.random() * idleMessages.length)]);
                }
                scheduleIdle();
            }, 15000 + Math.random() * 15000);
        }
        scheduleIdle();
    }

    startIdleTimer();
    startSupabasePoll();
    speak("✨ 我来啦~");
    setTimeout(function() { bubble.style.display = 'none'; }, 3000);
    console.log('✨ Pet Engine Loaded!');
})();
</script>
</body>
</html>
