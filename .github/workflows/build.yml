name: Build Operit Pet APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Sign APK with release key
        run: |
          # 生成 keystore（仅用于签名去 testOnly）
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Operit Pet, OU=Dev, O=Operit, L=Shanghai, C=CN"
          
          # 用 jarsigner 签名 APK
          jarsigner -keystore release.keystore -storepass android \
            -keypass android -signedjar app-signed.apk \
            app/build/outputs/apk/debug/app-debug.apk release
          
          # 验证签名
          jarsigner -verify app-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: operit-pet-signed
          path: app-signed.apk